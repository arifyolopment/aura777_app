name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App & Package IPA
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -y Aura777_iOS.ipa Payload
          ls -la Aura777_iOS.ipa
          pwd

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura777-iOS-IPA
          path: build/ios/iphoneos/Aura777_iOS.ipa
          if-no-files-found: error
